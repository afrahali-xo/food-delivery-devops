<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickBite Food Delivery</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f6fa;margin:0;color:#222}
header{background:#202b3c;color:white;padding:24px;text-align:center}
main{max-width:760px;margin:32px auto;padding:0 16px}
.item{background:white;padding:18px;margin:12px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
button{background:#e85d04;color:white;border:0;padding:10px 16px;border-radius:6px;cursor:pointer}
</style></head>
<body><header><h1>QuickBite</h1><p>Simple food delivery demo</p></header>
<main><h2>Today's menu</h2>
{% for item in menu %}<section class="item"><div><strong>{{ item.name }}</strong><p>₹{{ item.price }}</p></div>
<button onclick="order({{ item.id }})">Order</button></section>{% endfor %}
<p id="message"></p></main>
<script>
async function order(itemId){
 const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_id:itemId})});
 const d=await r.json();document.getElementById('message').textContent=r.ok?d.message+': '+d.item.name:d.error;
}
</script></body></html>
